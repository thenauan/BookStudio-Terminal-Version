[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# O nome do pacote continua o da versão 1.x para o "pipx upgrade" de quem já instalou seguir funcionando
name = "audiobook-generator-terminal"
version = "2.0.2"
description = "BookStudio: create audiobooks, translate and convert e-books (EPUB, PDF, MOBI, AZW3, DOCX...) and generate synced text, in the terminal."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "thenauan" }]
keywords = ["audiobook", "ebook", "translation", "tts", "text-to-speech", "edge-tts", "epub", "m4b", "synced text", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = [
    "edge-tts", "beautifulsoup4", "lxml", "pypdf", "pdfplumber", "mobi", "langdetect", "mutagen", "deep-translator",
    "pillow", "rich", "questionary", "pymupdf", "lingua-language-detector", "charset-normalizer", "platformdirs",
    "keyring", "httpx",
]

[project.optional-dependencies]
ia = ["litellm"]
transcricao = ["faster-whisper"]

[project.urls]
Homepage = "https://github.com/thenauan/BookStudio"

[project.scripts]
bookstudio = "bookstudio.app:executar"
audiobook-generator = "bookstudio.app:executar"  # comando da versão 1.x

[tool.setuptools.packages.find]
include = ["bookstudio*"]

[tool.setuptools.package-data]
bookstudio = ["dados/*.json", "dados/i18n/*.json", "motor/*.json", "ebook/data/*.json"]
